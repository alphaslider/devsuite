<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DEV_SUITE</title><style>
:root{--bg:#004e98;--pn:#ece9d8;--al:linear-gradient(180deg,#0058e6 0%,#3a93ff 8%,#288cff 40%,#0058e6 100%);--br:#7f9db9;--ac:#316ac5;--tx:#000;--mt:#666;--dg:#e53935;--fn:Tahoma,"Microsoft Sans Serif",sans-serif}
body{margin:0;padding:10px;background:var(--bg);color:var(--tx);font-family:var(--fn);display:flex;flex-direction:column;align-items:center;min-height:100vh;box-sizing:border-box}

.ws{width:100%;max-width:1100px;background:var(--pn);border:3px solid #0055e5;border-radius:8px 8px 3px 3px;box-shadow:2px 2px 10px rgba(0,0,0,0.5);display:flex;flex-direction:column;height:calc(100vh - 20px);overflow:hidden}
@media(min-width:600px){.ws{height:calc(100vh - 40px)}}
header{display:flex;flex-direction:column;background:var(--pn)}
.wt{background:var(--al);color:#fff;padding:6px 10px;font-size:.9rem;font-weight:700;text-shadow:1px 1px 2px #000;border-bottom:1px solid #004e98}
.wt[contenteditable]:focus{outline:none;border-bottom:1px dashed #fff}
.nv{display:flex;gap:2px;width:100%;padding:6px 6px 0;border-bottom:1px solid #aca899;box-sizing:border-box}
.nt{background:#ece9d8;border:1px solid #aca899;border-bottom:none;padding:12px 2px;color:#000;cursor:pointer;font-family:var(--fn);font-size:.7rem;border-radius:3px 3px 0 0;margin-bottom:-1px;position:relative;z-index:1;text-transform:uppercase;flex:1;text-align:center}
@media(min-width:600px){.nt{padding:6px 12px;font-size:.75rem}}
.nt:hover{background:#f4f3eb}
.nt.active{background:#fff;border-color:#aca899;border-bottom-color:#fff;font-weight:700;z-index:3}
.ca{flex-grow:1;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#fff;margin:0 6px 6px;border:1px solid #aca899;border-top:none;box-sizing:border-box}
.pn{display:none;position:absolute;top:0;left:0;width:100%;height:100%;padding:16px;box-sizing:border-box;flex-direction:column;overflow-y:auto;background:var(--pn)}
@media(min-width:600px){.pn{padding:24px}}
.pn.active{display:flex}
.ph{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
@media(min-width:600px){.ph{flex-direction:row;justify-content:space-between;align-items:center}}
.ph h2{font-size:.95rem;margin:0;color:#003399;letter-spacing:0}
button{background:linear-gradient(to bottom,#f3f3eb 0%,#ece9d8 100%);border:1px solid #003c74;border-radius:3px;color:#000;padding:6px 14px;font-family:var(--fn);font-size:.8rem;cursor:pointer;box-shadow:inset 0 1px 0 #fff;text-transform:uppercase}
button:hover{background:linear-gradient(to bottom,#fff 0%,#ece9d8 100%);border-color:#003c74;box-shadow:inset 0 1px 0 #fff,0 1px 1px rgba(0,0,0,0.1)}
button:active{background:#dedad0;box-shadow:inset 0 1px 2px rgba(0,0,0,0.2)}
button.dg{color:var(--dg)}
button.tb-act{background:#dedad0;box-shadow:inset 0 2px 4px rgba(0,0,0,0.3);border-color:#aca899;font-weight:700}
.tl{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;flex-grow:1;overflow-y:auto}
.ti{display:flex;align-items:center;background:#fff;border:1px solid var(--br);padding:8px 10px;gap:10px;box-shadow:inset 1px 1px 2px #e0e0e0}
.ti:focus-within{border-color:var(--ac)}
.tn{font-weight:700;color:var(--mt);font-size:.85rem;min-width:24px}
.tinp{flex-grow:1;background:transparent;border:none;color:#000;font-family:var(--fn);font-size:.85rem;outline:0}
.ec{display:flex;flex-direction:column;flex-grow:1;border:1px solid var(--br);background:#fff;min-height:250px;box-shadow:inset 1px 1px 2px #e0e0e0}

.cep{display:flex;flex-direction:column;gap:2px;overflow:hidden;flex-grow:1}
.evp{background:#316ac5;color:#fff;padding:1px 3px;font-size:.6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:2px}
.mo{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);justify-content:center;align-items:center;z-index:1000;padding:15px;box-sizing:border-box}

.mh{display:flex;justify-content:space-between;align-items:center;background:var(--al);padding:6px 10px;border-radius:3px 3px 0 0}
.mh h3{margin:0;font-size:.95rem;color:#fff;text-shadow:1px 1px 2px #000}

.mh button:hover{background:#e53935;color:#fff;box-shadow:none;border-color:#e53935}
.eig{display:flex;gap:8px;flex-wrap:wrap;padding:16px 16px 0}
.ein{flex-grow:1;background:#fff;border:1px solid var(--br);padding:6px;color:#000;font-family:var(--fn);font-size:.85rem;outline:0;box-shadow:inset 1px 1px 2px #e0e0e0}

.eld{display:flex;flex-direction:column;gap:8px;max-height:180px;overflow-y:auto;padding:16px}
.er{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--br);padding:6px 10px;font-size:.8rem}
.er button{padding:2px 6px;font-size:.65rem}
.wf{background:var(--pn);border-top:1px solid #aca899;color:#555;padding:4px 10px;font-size:.7rem;box-shadow:inset 0 1px 0 #fff;text-align:center}
.c-w{width:100%;margin:0 auto;display:flex;flex-direction:column;flex-grow:1}
@media(min-width:600px){.c-w{max-width:320px;margin:20px auto;background:var(--pn);border:1px solid #aca899;padding:16px;border-radius:3px;box-shadow:2px 2px 5px rgba(0,0,0,0.1);flex-grow:0}}
.calc-dsp{width:100%;background:#fff;border:1px solid var(--br);color:#000;font-family:var(--fn);font-size:1.5rem;padding:12px;text-align:right;box-sizing:border-box;margin-bottom:12px;box-shadow:inset 1px 1px 2px #ccc}
.calc-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex-grow:1}
.calc-pad button{padding:16px;font-size:1rem;font-weight:700}
.timer-disp{font-size:3rem;color:#003399;text-align:center;margin:15px 0;font-weight:700;text-shadow:1px 1px 0 #fff}
.timer-ctrls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:15px}
.toast-container{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column-reverse;gap:10px;z-index:2000;max-width:350px;width:100%;pointer-events:none}
.toast-card{background:#ffffe1;border:1px solid #000;box-shadow:2px 2px 5px rgba(0,0,0,0.3);padding:14px;display:flex;flex-direction:column;gap:8px;pointer-events:auto;animation:slideIn .2s ease-out;color:#000}
.toast-title{font-size:.75rem;color:#003399;font-weight:700;text-transform:uppercase}
.toast-body{font-size:.85rem;color:#000}
.toast-footer{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.toast-footer span{font-size:.65rem;color:#666}
@[keyframes slideIn]{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.np-nav{display:flex;flex-direction:row;gap:2px;overflow-x:auto;background:var(--pn);padding:4px 4px 0 4px;border-bottom:1px solid #aca899;white-space:nowrap}
.np-t{padding:6px 10px;background:#ece9d8;color:#000;font-size:.7rem;cursor:pointer;border:1px solid #aca899;border-bottom:none;display:inline-flex;align-items:center;gap:6px;border-radius:3px 3px 0 0;margin-bottom:-1px;z-index:1;user-select:none}
.np-t:hover{background:#f4f3eb}
.np-t.act{background:#fff;border-bottom-color:#fff;font-weight:700;z-index:3}
.np-x{background:0 0;border:none;color:var(--dg);padding:0 4px;cursor:pointer;font-size:.7rem;box-shadow:none}
.np-x:hover{color:#fff;background:var(--dg);box-shadow:none}
</style></head><body><div class="ws"><header><div class="wt" id="mH" contenteditable="true" spellcheck="false" onblur="localStorage.setItem('dw_ht',this.innerText)">//_DEV_SUITE</div><div class="nv"><button class="nt active" onclick="sT(0)">Todo</button><button class="nt" onclick="sT(1)">Notes</button><button class="nt" onclick="sT(2)">Cal</button><button class="nt" onclick="sT(3)">Calc</button><button class="nt" onclick="sT(4)">Timer</button></div></header><div class="ca"><div class="pn active" id="p0"><div class="ph"><h2>TODO</h2><div id="cn" style="color:var(--mt);font-size:.85rem">1 Item</div></div><div class="tl" id="tL"></div><div style="display:flex;gap:10px"><button onclick="aR()">+ Add</button><button class="dg" onclick="cL()">Clear</button></div></div><div class="pn" id="p1"><div class="ph"><h2>SCRATCHPAD</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="svNBtn()">Save</button><button onclick="nANp()">Open (New)</button><button onclick="expTxt()">Export</button><button onclick="document.getElementById('impFile').click()">Import</button><input type="file" id="impFile" style="display:none" accept=".txt" onchange="impTxt(event)"></div></div><div class="np-nav" id="npN"></div><div class="ec"><div class="et"><span id="eSt">Auto-saving...</span><span id="cC">0 chars</span></div><textarea class="ce" id="cEd" placeholder="// Type here..." oninput="uES();sVN()"></textarea></div></div><div class="pn" id="p2"><div class="cc"><button onclick="cC(-1)">&larr;</button><h2 id="cMT" style="margin:0;font-size:.9rem;color:var(--ac)"></h2><button onclick="cC(1)">&rarr;</button></div><div class="cg" id="cGr"></div></div><div class="pn" id="p3"><div class="ph"><h2>CALCULATOR</h2></div><div class="c-w"><input type="text" class="calc-dsp" id="cD" readonly value="0"><div class="calc-pad"><button onclick="cIn('7')">7</button><button onclick="cIn('8')">8</button><button onclick="cIn('9')">9</button><button class="dg" onclick="cCl()">C</button><button onclick="cIn('4')">4</button><button onclick="cIn('5')">5</button><button onclick="cIn('6')">6</button><button onclick="cIn('/')">/</button><button onclick="cIn('1')">1</button><button onclick="cIn('2')">2</button><button onclick="cIn('3')">3</button><button onclick="cIn('*')">*</button><button onclick="cIn('0')">0</button><button onclick="cIn('.')">.</button><button onclick="cEv()">=</button><button onclick="cIn('-')">-</button><button style="grid-column:span 4" onclick="cIn('+')">+</button></div></div></div><div class="pn" id="p4"><div class="ph"><h2>TIMER / ALARM</h2><div style="display:flex;gap:8px"><button id="btnSw" class="tb-act" onclick="sTM('s')">Stopwatch</button><button id="btnAl" onclick="sTM('a')">Alarm</button></div></div><div class="timer-disp" id="tDsp">00:00:00</div><div class="timer-ctrls"><button onclick="tSt()">Start</button><button onclick="tPa()">Pause</button><button class="dg" onclick="tRe()">Reset</button><button id="m1Btn" style="display:none" onclick="aTime(60)">+ 1 Min</button><button id="m5Btn" style="display:none" onclick="aTime(300)">+ 5 Min</button><button onclick="pTn('ding')">Test Tone</button></div><div style="display:flex;flex-direction:column;gap:10px;margin-top:10px;background:#fff;padding:12px;border:1px solid var(--br)"><div style="display:flex;justify-content:space-between;align-items:center"><label style="font-size:0.8rem;color:#000">Waveform / Sound Style:</label><select id="sndStyle" style="background:#fff;color:#000;border:1px solid var(--br);padding:6px;font-family:var(--fn);font-size:0.8rem"><option value="ding">Ding (Sine)</option><option value="melody">Soft Melody</option><option value="buzzer">Buzzer (Sawtooth)</option></select></div><div style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="d30s" style="accent-color:var(--ac)"><label for="d30s" style="font-size:0.8rem;color:#000">Ring/Ding for 30 seconds</label></div></div></div></div><div class="wf">Native JS &bull; Web Audio API</div></div><div class="mo" id="eMo"><div class="mb"><div class="mh"><h3 id="mDT">Events</h3><button onclick="cMo()">✕</button></div><div class="eig"><input type="text" class="ein" id="nEI" placeholder="Task description..." onkeydown="if(event.key==='Enter')aEv()"><input type="time" class="ein" id="nET" style="max-width:120px"><button onclick="aEv()">Add</button></div><div class="eld" id="eLD"></div></div></div><div class="toast-container" id="toastContainer"></div><script>function sT(i){sVN();sTd();document.querySelectorAll('.pn').forEach((p,x)=>p.classList.toggle('active',x===i));document.querySelectorAll('.nt').forEach((t,x)=>t.classList.toggle('active',x===i))}function sTd(){localStorage.setItem('dw_td',JSON.stringify(Array.from(document.querySelectorAll('.tinp')).map(i=>i.value)))}let dT=JSON.parse(localStorage.getItem('dw_td'))||["Check open tabs"];function iT(){const l=document.getElementById('tL');l.innerHTML='';dT.forEach((t,i)=>cTR(i+1,t));uTC()}function cTR(n,v=''){const l=document.getElementById('tL'),m=document.createElement('div');m.className='ti';m.innerHTML=`<span class="tn">#${n<10?'0'+n:n}</span><input type="text" class="tinp" value="${v}" placeholder="Task..." oninput="uTC();sTd()"><button class="dg" style="padding:6px 10px" onclick="this.parentElement.remove();rIT()">✕</button>`;l.appendChild(m)}function aR(){cTR(document.getElementById('tL').children.length+1);uTC();sTd()}function rIT(){Array.from(document.getElementById('tL').children).forEach((m,i)=>{m.querySelector('.tn').textContent=`#${(i+1)<10?'0'+(i+1):(i+1)}`});uTC();sTd()}function uTC(){const c=document.getElementById('tL').children.length;document.getElementById('cn').textContent=`${c} Item${c===1?'':'s'}`}function cL(){document.getElementById('tL').innerHTML='';uTC();sTd()}let ntps=JSON.parse(localStorage.getItem('dw_nps'));if(!ntps||!ntps.length){ntps=[{i:Date.now(),t:'Note 1',c:''}]}else{let sn=new Set();ntps.forEach(n=>{if(sn.has(n.i))n.i=Date.now()+Math.random();sn.add(n.i)})}let aNp=ntps[0].i;function rNp(){const nN=document.getElementById('npN');nN.innerHTML='';ntps.forEach(n=>{const b=document.createElement('div');b.className='np-t'+(n.i===aNp?' act':'');b.innerHTML=`<span style="flex-grow:1;padding:0 4px" onclick="sNp(${n.i})" ondblclick="pRn(${n.i})" title="Double-click to rename">${n.t}</span><button class="np-x" onclick="xNp(${n.i},event)">✕</button>`;nN.appendChild(b)});const aO=ntps.find(x=>x.i===aNp);if(aO)document.getElementById('cEd').value=aO.c;uES()}function pRn(i){const n=ntps.find(x=>x.i===i);if(!n)return;const nw=prompt("Rename Tab:",n.t);if(nw!==null&&nw.trim()!==''){n.t=nw.trim();sVN();rNp()}}function sNp(i){if(aNp===i)return;sVN();aNp=i;rNp()}function xNp(i,e){e.stopPropagation();if(ntps.length<2)return;const tb=ntps.find(x=>x.i===i);if(tb&&tb.c.trim()!==''&&!confirm("Close tab? Unsaved data will be deleted."))return;ntps=ntps.filter(n=>n.i!==i);if(aNp===i)aNp=ntps[0].i;sVN();rNp()}function nANp(){sVN();const nId=Date.now()+Math.random();ntps.push({i:nId,t:'Note '+(ntps.length+1),c:''});aNp=nId;rNp();sVN()}function uES(){const v=document.getElementById('cEd').value;document.getElementById('cC').textContent=`${v.length} chars`}function sVN(){const aO=ntps.find(x=>x.i===aNp);if(aO)aO.c=document.getElementById('cEd').value;localStorage.setItem('dw_nps',JSON.stringify(ntps))}function svNBtn(){sVN();const s=document.getElementById('eSt');s.textContent='Saved!';setTimeout(()=>s.textContent='Auto-saving...',2000)}function expTxt(){const aO=ntps.find(x=>x.i===aNp);if(!aO)return;const bl=new Blob([aO.c],{type:'text/plain'}),u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download=`${aO.t.toLowerCase().replace(/\s+/g,'_')}.txt`;a.click();URL.revokeObjectURL(u)}function impTxt(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(ev){const aO=ntps.find(x=>x.i===aNp);if(aO){aO.c=ev.target.result;document.getElementById('cEd').value=aO.c;sVN();uES()}};r.readAsText(f);e.target.value='';}let cDt=new Date(),sDK='',cEvs=JSON.parse(localStorage.getItem('dw_cl'))||{};function rC(){const y=cDt.getFullYear(),m=cDt.getMonth(),mn=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];document.getElementById('cMT').textContent=`${mn[m]} ${y}`;const g=document.getElementById('cGr');g.innerHTML='';['M','T','W','T','F','S','S'].forEach(d=>{const h=document.createElement('div');h.className='cdh';h.textContent=d;g.appendChild(h)});const fDI=new Date(y,m,1).getDay(),off=fDI===0?6:fDI-1,tDM=new Date(y,m+1,0).getDate(),pDM=new Date(y,m,0).getDate(),tS=new Date().toISOString().split('T')[0];for(let i=off-1;i>=0;i--){cCBl(g,!0,new Date(y,m-1,pDM-i),tS)}for(let i=1;i<=tDM;i++){cCBl(g,!1,new Date(y,m,i),tS)}const rem=42-(off+tDM);for(let i=1;i<=rem;i++){cCBl(g,!0,new Date(y,m+1,i),tS)}}function cCBl(g,o,dObj,tS){const c=document.createElement('div');c.className='ccl'+(o?' om':'');const dK=dObj.toISOString().split('T')[0];if(dK===tS)c.classList.add('td');c.innerHTML=`<div class="cdt">${dObj.getDate()}</div><div class="cep"></div>`;const p=c.querySelector('.cep');if(cEvs[dK]){cEvs[dK].forEach(e=>{const p1=document.createElement('div');p1.className='evp';p1.textContent=(e.time?e.time+' ':'')+e.text;p.appendChild(p1)})}c.onclick=()=>oM(dK,dObj);g.appendChild(c)}function cC(d){cDt.setMonth(cDt.getMonth()+d);rC()}function oM(dK,dObj){sDK=dK;document.getElementById('mDT').textContent=dObj.toDateString();document.getElementById('nEI').value='';document.getElementById('nET').value='';rME();document.getElementById('eMo').classList.add('active');document.getElementById('nEI').focus()}function cMo(){document.getElementById('eMo').classList.remove('active');rC()}function rME(){const l=document.getElementById('eLD');l.innerHTML='';const evs=cEvs[sDK]||[];if(evs.length===0){l.innerHTML='<div style="color:var(--mt);font-size:.85rem;text-align:center;padding:10px">No entries.</div>';return}evs.forEach((e,i)=>{const r=document.createElement('div');r.className='er';r.innerHTML=`<span>${e.time?e.
