<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DEV_SUITE</title><style>:root{--bg:#121214;--pn:#1a1a1e;--al:#222228;--br:#2a2a30;--ac:#00ffcc;--tx:#e0e0e6;--mt:#8a8a95;--dg:#ff3366;--fn:monospace,sans-serif}body{margin:0;padding:10px;background:var(--bg);color:var(--tx);font-family:var(--fn);display:flex;flex-direction:column;align-items:center;min-height:100vh;box-sizing:border-box}@media(min-width:600px){body{padding:20px}}.ws{width:100%;max-width:1000px;background:var(--pn);border:1px solid var(--br);box-shadow:0 8px 24px rgba(0,0,0,.6);display:flex;flex-direction:column;height:calc(100vh - 20px);max-height:900px}@media(min-width:600px){.ws{height:85vh}}header{display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--br);padding:12px 16px;background:var(--al)}@media(min-width:600px){header{flex-direction:row;justify-content:space-between;align-items:center;padding:0 20px;height:50px}}.wt{font-size:.95rem;color:var(--ac);letter-spacing:1px;font-weight:700}.nv{display:flex;gap:4px;overflow-x:auto;width:100%;padding-bottom:4px}@media(min-width:600px){.nv{width:auto;padding-bottom:0}}.nt{background:var(--bg);border:1px solid var(--br);padding:8px 10px;color:var(--mt);cursor:pointer;font-family:var(--fn);font-size:.7rem;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;flex-shrink:0;transition:.2s}.nt:hover{color:var(--tx);background:var(--pn)}.nt.active{background:var(--pn);color:var(--ac);border-color:var(--ac)}.ca{flex-grow:1;position:relative;overflow:hidden;display:flex;flex-direction:column}.pn{display:none;position:absolute;top:0;left:0;width:100%;height:100%;padding:16px;box-sizing:border-box;flex-direction:column;overflow-y:auto}@media(min-width:600px){.pn{padding:24px}}.pn.active{display:flex}.ph{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}@media(min-width:600px){.ph{flex-direction:row;justify-content:space-between;align-items:center}}.ph h2{font-size:.95rem;margin:0;color:var(--tx);letter-spacing:1px}button{background:var(--br);color:var(--tx);border:none;padding:10px 14px;font-family:var(--fn);font-size:.8rem;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:.2s}button:hover{background:var(--ac);color:#000}button.dg:hover{background:var(--dg);color:#fff}.tl{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;flex-grow:1;overflow-y:auto}.ti{display:flex;align-items:center;background:var(--bg);border:1px solid var(--br);padding:8px 10px;gap:10px}.ti:focus-within{border-color:var(--ac)}.tn{font-weight:700;color:var(--mt);font-size:.85rem;min-width:24px}.tinp{flex-grow:1;background:0 0;border:none;color:var(--tx);font-family:var(--fn);font-size:.85rem;outline:0}.ec{display:flex;flex-direction:column;flex-grow:1;border:1px solid var(--br);background:var(--bg);min-height:250px}.et{display:flex;justify-content:space-between;padding:8px 12px;background:var(--al);border-bottom:1px solid var(--br);font-size:.75rem;color:var(--mt)}textarea.ce{flex-grow:1;background:var(--bg);color:var(--ac);border:none;padding:12px;font-family:var(--fn);font-size:.9rem;line-height:1.5;resize:none;outline:0;tab-size:4}.cc{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--br);border:1px solid var(--br);flex-grow:1}.cdh{background:var(--al);color:var(--mt);padding:6px 2px;text-align:center;font-size:.65rem;font-weight:700}.ccl{background:var(--bg);min-height:60px;padding:4px;display:flex;flex-direction:column;cursor:pointer;transition:.15s;position:relative;border:1px solid transparent;overflow:hidden}.ccl:hover{background:var(--al);border-color:var(--ac)}.ccl.om{opacity:.3}.cdt{font-size:.7rem;color:var(--mt);margin-bottom:2px}.ccl.td .cdt{color:var(--ac);font-weight:700}.cep{display:flex;flex-direction:column;gap:2px;overflow:hidden;flex-grow:1}.evp{background:var(--al);border-left:2px solid var(--ac);padding:1px 3px;font-size:.6rem;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mo{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);justify-content:center;align-items:center;z-index:1000;padding:15px;box-sizing:border-box}.mo.active{display:flex}.mb{background:var(--pn);border:1px solid var(--br);width:100%;max-width:450px;padding:16px;box-shadow:0 12px 32px rgba(0,0,0,.8);display:flex;flex-direction:column;gap:14px}.mh{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--br);padding-bottom:10px}.mh h3{margin:0;font-size:.95rem;color:var(--ac)}.eig{display:flex;gap:8px;flex-wrap:wrap}.ein{flex-grow:1;background:var(--bg);border:1px solid var(--br);padding:10px;color:var(--tx);font-family:var(--fn);font-size:.85rem;outline:0}.ein:focus{border-color:var(--ac)}.eld{display:flex;flex-direction:column;gap:8px;max-height:180px;overflow-y:auto}.er{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--br);padding:8px 12px;font-size:.8rem}.er button{padding:4px 8px;font-size:.65rem}.wf{padding:10px 16px;background:var(--al);border-top:1px solid var(--br);font-size:.7rem;color:var(--mt);text-align:center}.calc-dsp{width:100%;background:var(--bg);border:1px solid var(--br);color:var(--ac);font-family:var(--fn);font-size:1.5rem;padding:12px;text-align:right;box-sizing:border-box;margin-bottom:12px}.calc-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex-grow:1}.calc-pad button{padding:16px;font-size:1rem}.timer-disp{font-size:3rem;color:var(--ac);text-align:center;margin:20px 0;font-weight:700}.timer-ctrls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.np-nav{display:flex;gap:2px;overflow-x:auto;background:var(--al);padding:4px 4px 0 4px;border-bottom:1px solid var(--br)}.np-t{padding:6px 10px;background:var(--bg);color:var(--mt);font-size:.7rem;cursor:pointer;border:1px solid var(--br);border-bottom:none;display:flex;align-items:center;gap:6px}.np-t.act{color:var(--ac);border-top:2px solid var(--ac)}.np-x{background:0 0;border:none;color:var(--dg);padding:0 4px;cursor:pointer;font-size:.7rem}.np-x:hover{color:#fff;background:var(--dg)}</style></head><body><div class="ws"><header><div class="wt">//_DEV_SUITE</div><div class="nv"><button class="nt active" onclick="sT(0)">Todo</button><button class="nt" onclick="sT(1)">Notes</button><button class="nt" onclick="sT(2)">Cal</button><button class="nt" onclick="sT(3)">Calc</button><button class="nt" onclick="sT(4)">Timer</button></div></header><div class="ca"><div class="pn active" id="p0"><div class="ph"><h2>TODO</h2><div id="cn" style="color:var(--mt);font-size:.85rem">1 Item</div></div><div class="tl" id="tL"></div><div style="display:flex;gap:10px"><button onclick="aR()">+ Add</button><button class="dg" onclick="cL()">Clear</button></div></div><div class="pn" id="p1"><div class="ph"><h2>SCRATCHPAD</h2><div style="display:flex;gap:8px"><button onclick="svNBtn()">Save</button><button onclick="nANp()">Open (New)</button></div></div><div class="np-nav" id="npN"></div><div class="ec"><div class="et"><span id="eSt">Auto-saving...</span><span id="cC">0 chars</span></div><textarea class="ce" id="cEd" placeholder="// Type here..." oninput="uES();sVN()"></textarea></div></div><div class="pn" id="p2"><div class="cc"><button onclick="cC(-1)">&larr;</button><h2 id="cMT" style="margin:0;font-size:.9rem;color:var(--ac)"></h2><button onclick="cC(1)">&rarr;</button></div><div class="cg" id="cGr"></div></div><div class="pn" id="p3"><div class="ph"><h2>CALCULATOR</h2></div><input type="text" class="calc-dsp" id="cD" readonly value="0"><div class="calc-pad"><button onclick="cIn('7')">7</button><button onclick="cIn('8')">8</button><button onclick="cIn('9')">9</button><button class="dg" onclick="cCl()">C</button><button onclick="cIn('4')">4</button><button onclick="cIn('5')">5</button><button onclick="cIn('6')">6</button><button onclick="cIn('/')">/</button><button onclick="cIn('1')">1</button><button onclick="cIn('2')">2</button><button onclick="cIn('3')">3</button><button onclick="cIn('*')">*</button><button onclick="cIn('0')">0</button><button onclick="cIn('.')">.</button><button onclick="cEv()">=</button><button onclick="cIn('-')">-</button><button style="grid-column:span 4" onclick="cIn('+')">+</button></div></div><div class="pn" id="p4"><div class="ph"><h2>TIMER / ALARM</h2><div style="display:flex;gap:8px"><button onclick="sTM('s')">Stopwatch</button><button onclick="sTM('a')">Alarm</button></div></div><div class="timer-disp" id="tDsp">00:00:00</div><div class="timer-ctrls"><button onclick="tSt()">Start</button><button onclick="tPa()">Pause</button><button class="dg" onclick="tRe()">Reset</button><button id="aBtn" style="display:none;color:var(--ac)" onclick="a5M()">+ 5 Min</button><button onclick="pTn()">Test Tone</button></div></div></div><div class="wf">Native JS &bull; Web Audio API</div></div><div class="mo" id="eMo"><div class="mb"><div class="mh"><h3 id="mDT">Events</h3><button onclick="cMo()" style="padding:4px 8px">✕</button></div><div class="eig"><input type="text" class="ein" id="nEI" placeholder="Task description..." onkeydown="if(event.key==='Enter')aEv()"><input type="time" class="ein" id="nET" style="max-width:120px"><button onclick="aEv()">Add</button></div><div class="eld" id="eLD"></div></div></div><script>function sT(i){document.querySelectorAll('.pn').forEach((p,x)=>p.classList.toggle('active',x===i));document.querySelectorAll('.nt').forEach((t,x)=>t.classList.toggle('active',x===i))}let dT=["Check open tabs"];function iT(){const l=document.getElementById('tL');l.innerHTML='';dT.forEach((t,i)=>cTR(i+1,t));uTC()}function cTR(n,v=''){const l=document.getElementById('tL'),m=document.createElement('div');m.className='ti';m.innerHTML=`<span class="tn">#${n<10?'0'+n:n}</span><input type="text" class="tinp" value="${v}" placeholder="Task..." oninput="uTC()"><button class="dg" style="padding:6px 10px" onclick="this.parentElement.remove();rIT()">✕</button>`;l.appendChild(m)}function aR(){cTR(document.getElementById('tL').children.length+1);uTC()}function rIT(){Array.from(document.getElementById('tL').children).forEach((m,i)=>{m.querySelector('.tn').textContent=`#${(i+1)<10?'0'+(i+1):(i+1)}`});uTC()}function uTC(){const c=document.getElementById('tL').children.length;document.getElementById('cn').textContent=`${c} Item${c===1?'':'s'}`}function cL(){document.getElementById('tL').innerHTML='';uTC()}let ntps=JSON.parse(localStorage.getItem('dw_nps'))||[{i:Date.now(),t:'Note 1',c:''}],aNp=ntps[0].i;function rNp(){const nN=document.getElementById('npN');nN.innerHTML='';ntps.forEach(n=>{const b=document.createElement('div');b.className='np-t'+(n.i===aNp?' act':'');b.innerHTML=`<span onclick="sNp(${n.i})">${n.t}</span><button class="np-x" onclick="xNp(${n.i},event)">✕</button>`;nN.appendChild(b)});const aO=ntps.find(x=>x.i===aNp);document.getElementById('cEd').value=aO?aO.c:'';uES()}function sNp(i){aNp=i;rNp()}function xNp(i,e){e.stopPropagation();if(ntps.length<2)return;ntps=ntps.filter(n=>n.i!==i);if(aNp===i)aNp=ntps[0].i;sVN();rNp()}function nANp(){ntps.push({i:Date.now(),t:'Note '+(ntps.length+1),c:''});aNp=ntps[ntps.length-1].i;sVN();rNp()}function uES(){const v=document.getElementById('cEd').value;document.getElementById('cC').textContent=`${v.length} chars`}function sVN(){const aO=ntps.find(x=>x.i===aNp);if(aO)aO.c=document.getElementById('cEd').value;localStorage.setItem('dw_nps',JSON.stringify(ntps))}function svNBtn(){sVN();const s=document.getElementById('eSt');s.textContent='Saved!';setTimeout(()=>s.textContent='Auto-saving...',2000)}let cDt=new Date(),sDK='',cEvs=JSON.parse(localStorage.getItem('dw_cl'))||{};function rC(){const y=cDt.getFullYear(),m=cDt.getMonth(),mn=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];document.getElementById('cMT').textContent=`${mn[m]} ${y}`;const g=document.getElementById('cGr');g.innerHTML='';['M','T','W','T','F','S','S'].forEach(d=>{const h=document.createElement('div');h.className='cdh';h.textContent=d;g.appendChild(h)});const fDI=new Date(y,m,1).getDay(),off=fDI===0?6:fDI-1,tDM=new Date(y,m+1,0).getDate(),pDM=new Date(y,m,0).getDate(),tS=new Date().toISOString().split('T')[0];for(let i=off-1;i>=0;i--){cCBl(g,!0,new Date(y,m-1,pDM-i),tS)}for(let i=1;i<=tDM;i++){cCBl(g,!1,new Date(y,m,i),tS)}const rem=42-(off+tDM);for(let i=1;i<=rem;i++){cCBl(g,!0,new Date(y,m+1,i),tS)}}function cCBl(g,o,dObj,tS){const c=document.createElement('div');c.className='ccl'+(o?' om':'');const dK=dObj.toISOString().split('T')[0];if(dK===tS)c.classList.add('td');c.innerHTML=`<div class="cdt">${dObj.getDate()}</div><div class="cep"></div>`;const p=c.querySelector('.cep');if(cEvs[dK]){cEvs[dK].forEach(e=>{const p1=document.createElement('div');p1.className='evp';p1.textContent=(e.time?e.time+' ':'')+e.text;p.appendChild(p1)})}c.onclick=()=>oM(dK,dObj);g.appendChild(c)}function cC(d){cDt.setMonth(cDt.getMonth()+d);rC()}function oM(dK,dObj){sDK=dK;document.getElementById('mDT').textContent=dObj.toDateString();document.getElementById('nEI').value='';document.getElementById('nET').value='';rME();document.getElementById('eMo').classList.add('active');document.getElementById('nEI').focus()}function cMo(){document.getElementById('eMo').classList.remove('active');rC()}function rME(){const l=document.getElementById('eLD');l.innerHTML='';const evs=cEvs[sDK]||[];if(evs.length===0){l.innerHTML='<div style="color:var(--mt);font-size:.85rem;text-align:center;padding:10px">No entries.</div>';return}evs.forEach((e,i)=>{const r=document.createElement('div');r.className='er';r.innerHTML=`<span>${e.time?e.time+' - ':''}${e.text}</span><button class="dg" onclick="rEv(${i})">Del</button>`;l.appendChild(r)})}function aEv(){const inp=document.getElementById('nEI'),tInp=document.getElementById('nET'),v=inp.value.trim(),tV=tInp.value;if(!v)return;if(!cEvs[sDK])cEvs[sDK]=[];cEvs[sDK].push({text:v,time:tV});localStorage.setItem('dw_cl',JSON.stringify(cEvs));inp.value='';tInp.value='';rME()}function rEv(i){cEvs[sDK].splice(i,1);if(cEvs[sDK].length===0)delete cEvs[sDK];localStorage.setItem('dw_cl',JSON.stringify(cEvs));rME()}let cEx='';function cIn(v){if(cEx==='0'&&v!=='.')cEx='';cEx+=v;document.getElementById('cD').value=cEx}function cCl(){cEx='';document.getElementById('cD').value='0'}function cEv(){try{cEx=eval(cEx).toString();document.getElementById('cD').value=cEx}catch(e){document.getElementById('cD').value='ERR';cEx=''}}let tm=0,cDw=0,tI=null,tM='s';const aCx=new(window.AudioContext||window.webkitAudioContext)();function pTn(){if(aCx.state==='suspended')aCx.resume();const o=aCx.createOscillator(),g=aCx.createGain();o.connect(g);g.connect(aCx.destination);o.type='square';o.frequency.value=880;g.gain.setValueAtTime(.1,aCx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,aCx.currentTime+.5);o.start();o.stop(aCx.currentTime+.5)}function sTM(m){tM=m;tPa();uTD();document.getElementById('aBtn').style.display=m==='a'?'inline-block':'none'}function a5M(){cDw+=300;uTD()}function uTD(){const s=tM==='s'?tm:cDw;document.getElementById('tDsp').textContent=[Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(v=>String(v).padStart(2,'0')).join(':')}function tTk(){if(tM==='s')tm++;else{if(cDw>0){cDw--;if(cDw===0){tPa();pTn();setTimeout(pTn,500);setTimeout(pTn,1000);alert("TIMER COMPLETE!")}}}uTD()}function tSt(){if(!tI)tI=setInterval(tTk,1000)}function tPa(){clearInterval(tI);tI=null}function tRe(){tPa();if(tM==='s')tm=0;else cDw=0;uTD()}setInterval(()=>{const now=new Date(),dK=now.toISOString().split('T')[0],tStr=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');if(cEvs[dK]){let upd=false;cEvs[dK].forEach(e=>{if(e.time===tStr&&!e.alerted){e.alerted=true;upd=true;pTn();alert('APPOINTMENT:\\n'+e.text)}});if(upd)localStorage.setItem('dw_cl',JSON.stringify(cEvs))}},1000);window.onload=()=>{iT();rNp();rC();}</script></body></html>
